[project]
name = "greek-pii-redactor"
version = "0.1.0"
description = "Redacts personal data from Greek and English text before an LLM call and restores it in the reply"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["Faker==40.54.0"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6", "greek-pii-redactor[serve,names]"]
eval = [
    "presidio-analyzer==2.2.366",
    "pyarrow==26.0.1",
    "spacy==3.8.18",
]
train = ["torch==2.15.0", "transformers==5.23.0"]
names = ["scikit-learn==1.9.1"]
serve = ["fastapi==0.165.0", "httpx==0.28.1", "uvicorn==0.54.0"]

[project.scripts]
greek-pii-redactor = "greek_pii_redactor.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
